name: Validate Vellum
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: vellum_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python scripts/generate_samples.py
      - run: python -m unittest discover -s tests -v
      - run: npm test && npm run check
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:ci-fixture-only@localhost:5432/vellum_test
      - run: python scripts/verify-postgres.py
        env:
          DATABASE_URL: postgresql://postgres:ci-fixture-only@localhost:5432/vellum_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PYTHON_BIN: python
      - run: python scripts/evaluate.py ci --require-zero-false-approves
      - run: docker build -t vellum:ci .
      - run: docker run --rm --entrypoint /opt/venv/bin/python vellum:ci -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            reports/
            playwright-report/
            test-results/
            docs/qa/
